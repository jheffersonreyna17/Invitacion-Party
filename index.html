<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Invitación END YEAR Party</title>
  <link rel="stylesheet" href="./style.css" />
</head>

<body>

  <!-- OVERLAY -->
  <div class="video-overlay"></div>

  <!-- FUEGOS ARTIFICIALES -->
  <canvas id="fireworks" aria-hidden="true"></canvas>

  <!-- CONTENIDO -->
  <main class="wrap">
    <section class="invite-story">
      

      <h1 class="title-story">
        <span class="pool">BIRTHDAY</span>
        <span class="party">Party!</span>
      </h1>

      <p class="story-sub">
        CELEBREMOS JUNTOS <br>
        ESTE GRAN DÍA
      </p>

      <div class="story-date">Sabado 25 de abril</div>

      <!-- CONTADOR -->
      <div class="countdown">
        <div class="time-box"><span id="days">00</span><small>Días</small></div>
        <div class="time-box"><span id="hours">00</span><small>Horas</small></div>
        <div class="time-box"><span id="minutes">00</span><small>Min</small></div>
        <div class="time-box"><span id="seconds">00</span><small>Seg</small></div>
      </div>

      <!-- DETALLES -->
      <div class="story-details">
        <div class="detail-item">⏰ <span>Hora:</span> 7:00 p. m.</div>
        <div class="detail-item">👕 <span>Dress code:</span> Sport Elegante / Casual</div>
      </div>

      <div class="event-highlights">
        <span class="highlight">🍾 Brindis</span>
        <span class="highlight">🎶 Música</span>
        <span class="highlight">✨ Ambiente festivo</span>
      </div>

      <!-- UBICACIÓN -->
      <div class="location-box">
        <div class="location-title">📍 Ubicación</div>
        <a class="maps-btn" href="https://maps.app.goo.gl/MyF316vvFA6GEPbJ9" target="_blank">
          Abrir en Maps
        </a>
      </div>

      <div class="story-footer">
        Brindemos por lo vivido y lo que viene 🥂
      </div>

      <!-- WHATSAPP -->
      

    </section>
  </main>

  <script src="./app.js"></script>
</body>
</html>
